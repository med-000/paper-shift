[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "paper-shift"
version = "0.2.0"
description = "Translate research papers into Japanese PDFs using your ChatGPT plan."
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["PyJWT[crypto]>=2.10,<3", "questionary>=2.1,<3", "filelock>=3.16,<4", "PyMuPDF>=1.26,<2"]

[project.scripts]
pshift = "src.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src"]
